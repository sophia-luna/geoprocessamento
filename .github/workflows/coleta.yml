name: Coleta de Dados de Trânsito

on:
  schedule:
    # Roda a cada 15 min, das 09h-12h e 19h-23h em UTC (06h-09h e 16h-20h no Brasil)
    - cron: '*/15 9-12,19-23 * * *'
  workflow_dispatch: # Permite rodar manualmente clicando em um botão

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar script de coleta
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python script_coleta_dados.py